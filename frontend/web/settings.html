<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Drishti - Settings</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="sidebar-header">
                <h3>Drishti</h3>
                <p>AI-Powered Awareness</p>
            </div>
            <ul class="sidebar-menu">
                <li><a href="index.html"><i class="bi bi-grid-1x2-fill"></i> Dashboard</a></li>
                <li><a href="incidents.html"><i class="bi bi-exclamation-triangle-fill"></i> Incidents</a></li>
                <li><a href="analytics.html"><i class="bi bi-graph-up"></i> Analytics</a></li>
                <li><a href="cameras.html"><i class="bi bi-camera-video-fill"></i> Cameras</a></li>
                <li class="active"><a href="settings.html"><i class="bi bi-gear-fill"></i> Settings</a></li>
            </ul>
            <div class="sidebar-footer">
               
                <a href="#" id="logout-link"><i class="bi bi-box-arrow-right"></i> Logout</a>
            </div>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <!-- Top Navigation -->
            <div class="top-nav">
                <div class="nav-actions ms-auto">
                    <div class="notification-icon">
                        <i class="bi bi-bell-fill"></i>
                        <span class="badge">1</span>
                    </div>
                    <div class="user-profile">
                        <img src="https://via.placeholder.com/40" alt="User">
                        <span>Admin User</span>
                    </div>
                </div>
            </div>

            <!-- Settings Content -->
            <div class="page-content">
                <div class="page-header">
                    <div>
                        <h1>System Settings</h1>
                        <p class="text-muted">Manage organization-wide preferences and integrations</p>
                    </div>
                    <button class="btn btn-primary"><i class="bi bi-save"></i> Save All</button>
                </div>

                <div class="content-section">
                    
                        
                        <div class="col-md-9">
                            <div class="card mb-4" id="profile">
                                <div class="card-header">
                                    <h5 class="mb-0">Profile Settings</h5>
                                </div>
                                <div class="card-body">
                                    <form>
                                        <div class="row mb-3">
                                            <div class="col-md-4 text-center mb-3 mb-md-0">
                                                <div class="avatar-large">
                                                    <span id="avatar-text">AU</span>
                                                </div>
                                                <button type="button" class="btn btn-sm btn-outline-primary mt-2">Change Avatar</button>
                                            </div>
                                            <div class="col-md-8">
                                                <div class="mb-3">
                                                    <label for="fullName" class="form-label">Full Name</label>
                                                    <input type="text" class="form-control" id="fullName" value="Admin User">
                                                </div>
                                                <div class="mb-3">
                                                    <label for="email" class="form-label">Email</label>
                                                    <input type="email" class="form-control" id="email" value="admin@projectdrishti.com">
                                                </div>
                                                <div class="mb-3">
                                                    <label for="role" class="form-label">Role</label>
                                                    <input type="text" class="form-control" id="role" value="System Administrator" readonly>
                                                </div>
                                            </div>
                                        </div>
                                        <div class="mb-3">
                                            <label for="phone" class="form-label">Phone Number</label>
                                            <input type="tel" class="form-control" id="phone" value="+1 (555) 123-4567">
                                        </div>
                                        <div class="mb-3">
                                            <label for="timezone" class="form-label">Timezone</label>
                                            <select class="form-select" id="timezone">
                                                <option value="UTC-8">Pacific Time (UTC-8)</option>
                                                <option value="UTC-5">Eastern Time (UTC-5)</option>
                                                <option value="UTC+0">Greenwich Mean Time (UTC+0)</option>
                                                <option value="UTC+5.5" selected>Indian Standard Time (UTC+5.5)</option>
                                                <option value="UTC+8">China Standard Time (UTC+8)</option>
                                            </select>
                                        </div>
                                        <div class="mb-3">
                                            <label for="bio" class="form-label">Bio</label>
                                            <textarea class="form-control" id="bio" rows="3">System administrator for Project Drishti security platform.</textarea>
                                        </div>
                                        <button type="submit" class="btn btn-primary">Save Changes</button>
                                    </form>
                                </div>
                            </div>
                            
                            
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Check if user is logged in
        window.addEventListener('DOMContentLoaded', function() {
            if (!localStorage.getItem('drishti_logged_in')) {
                window.location.href = 'login.html';
            } else {
                // Display username
                const username = localStorage.getItem('drishti_username');
                if (username) {
                    document.getElementById('username-display').textContent = username;
                    
                    // Set avatar text
                    const avatarEl = document.querySelector('.avatar');
                    if (avatarEl) {
                        avatarEl.textContent = username.substring(0, 2).toUpperCase();
                    }
                    
                    // Set large avatar text
                    const avatarTextEl = document.getElementById('avatar-text');
                    if (avatarTextEl) {
                        avatarTextEl.textContent = username.substring(0, 2).toUpperCase();
                    }
                }
            }
        });
        
        // Logout functionality
        document.getElementById('logout-link').addEventListener('click', function(e) {
            e.preventDefault();
            localStorage.removeItem('drishti_logged_in');
            localStorage.removeItem('drishti_username');
            window.location.href = 'login.html';
        });
        
        // Settings navigation
        document.querySelectorAll('.settings-nav .list-group-item').forEach(item => {
            item.addEventListener('click', function(e) {
                e.preventDefault();
                
                // Remove active class from all items
                document.querySelectorAll('.settings-nav .list-group-item').forEach(i => {
                    i.classList.remove('active');
                });
                
                // Add active class to clicked item
                this.classList.add('active');
                
                // Scroll to the target section
                const targetId = this.getAttribute('href');
                document.querySelector(targetId).scrollIntoView({
                    behavior: 'smooth'
                });
            });
        });
    </script>

    <script src="firebase-config.js"></script>
    <script src="app.js"></script>
</body>
</html>
