<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Drishti - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            background: linear-gradient(135deg, #1a2a6c, #b21f1f, #fdbb2d);
            background-size: 400% 400%;
            animation: gradient 15s ease infinite;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        @keyframes gradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        
        .login-container {
            background-color: rgba(15, 23, 42, 0.8);
            border-radius: 10px;
            padding: 2rem;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
        }
        
        .login-logo {
            text-align: center;
            margin-bottom: 2rem;
            font-size: 2rem;
            color: white;
        }
        
        .login-logo i {
            font-size: 3rem;
            margin-bottom: 1rem;
            color: #3b82f6;
        }
        
        .form-control {
            background-color: rgba(30, 41, 59, 0.8);
            border: none;
            color: white;
            padding: 0.8rem;
            margin-bottom: 1rem;
        }
        
        .form-control:focus {
            background-color: rgba(30, 41, 59, 0.9);
            color: white;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.5);
        }
        
        .btn-login {
            background-color: #3b82f6;
            border: none;
            width: 100%;
            padding: 0.8rem;
            font-weight: bold;
            margin-top: 1rem;
        }
        
        .btn-login:hover {
            background-color: #2563eb;
        }
        
        .login-footer {
            text-align: center;
            margin-top: 2rem;
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-logo">
            <i class="bi bi-shield-fill-check"></i>
            <div>Project Drishti</div>
        </div>
        
        <form id="login-form">
            <div class="mb-3">
                <label for="username" class="form-label text-light">Username</label>
                <input type="text" class="form-control" id="username" placeholder="Enter your username" required>
            </div>
            
            <div class="mb-3">
                <label for="password" class="form-label text-light">Password</label>
                <input type="password" class="form-control" id="password" placeholder="Enter your password" required>
            </div>
            
            <div class="mb-3 form-check">
                <input type="checkbox" class="form-check-input" id="remember">
                <label class="form-check-label text-light" for="remember">Remember me</label>
            </div>
            
            <button type="submit" class="btn btn-primary btn-login">Login</button>
            
            <div class="alert alert-danger mt-3 d-none" id="login-error">
                Invalid username or password. Please try again.
            </div>
        </form>
        
        <div class="login-footer">
            Project Drishti &copy; 2023 - AI-Powered Security System
        </div>
    </div>

    <script>
        document.getElementById('login-form').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            // Simple credential check (in a real app, this would be server-side)
            if (username === 'admin' && password === 'admin123') {
                // Store login state
                localStorage.setItem('drishti_logged_in', 'true');
                localStorage.setItem('drishti_username', username);
                
                // Redirect to dashboard
                window.location.href = 'index.html';
            } else {
                // Show error
                document.getElementById('login-error').classList.remove('d-none');
                
                // Clear password field
                document.getElementById('password').value = '';
            }
        });
        
        // Check if user is already logged in
        window.addEventListener('load', function() {
            if (localStorage.getItem('drishti_logged_in') === 'true') {
                window.location.href = 'index.html';
            }
        });
    </script>
</body>
</html>
